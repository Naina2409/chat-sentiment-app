<!DOCTYPE html>
<html>
<head>
  <title>Socket Test Naina</title>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body>
  <h2>Open browser console for logs</h2>
  <input id="msgInput" placeholder="Type a message" />
  <button onclick="sendMsg()">Send</button>

  <script>
    const token = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjZhODY4ZmM1Y2MwZTBkODcyZjJhZTUxYiIsImlhdCI6MTc4NzIwNDIxNiwiZXhwIjoxNzg3ODA5MDE2fQ.GiHGyyN04MvdO61X0Ds5WlKOgwZvl0EM6FZlJpCSAyM";
    const conversationId = "6a86989686a75a3eb7a9c9e5";

   
  

  async function loadHistory() {
    const res = await fetch(`http://localhost:5000/api/conversations/${conversationId}/messages`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const messages = await res.json();
    console.log("Chat history loaded:", messages);
  }

  const socket = io("http://localhost:5000", {
    auth: { token },
  });

  socket.on("connect", async () => {
    console.log("Connected! Socket ID:", socket.id);
    await loadHistory();          // 1. load past messages first
    socket.emit("join_conversation", conversationId); // 2. then join room for live updates
  });

  socket.on("receive_message", (message) => {
    console.log("New message received:", message);
  });

  socket.on("message_error", (err) => {
    console.log("Message error:", err);
  });

  function sendMsg() {
    const text = document.getElementById("msgInput").value;
    socket.emit("send_message", { conversationId, text });
    document.getElementById("msgInput").value = "";
  }
</script>
</body>
</html>
